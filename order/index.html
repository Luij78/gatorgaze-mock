<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Form | Gator Gaze Media</title>
  <meta name="description" content="Demo order form for Gator Gaze Media listing media. Nothing you enter is submitted.">
  <link rel="icon" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="../css/order.css">
</head>
<body>
  <div class="order-page">
    <header class="brand-card">
      <img src="../assets/logo.png" alt="Gator Gaze Real Estate Media">
      <p>Please complete the information below to place an order</p>
    </header>
    <section class="form-card">
      <div class="stepper" id="stepper" aria-label="Order steps"></div>
      <div class="cartbar" id="cartbar" hidden></div>
      <div id="step"></div>
    </section>
    <p class="demo-foot">Demo mockup — not affiliated with Gator Gaze Media. This form never sends an order.</p>
  </div>
  <div class="modal-root" id="modal-root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../js/catalog.js"></script>
  <script src="../js/order.js"></script>
</body>
</html>
